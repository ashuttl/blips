[project]
name = "blips"
version = "0.1.0"
description = "A live air-traffic scope in the terminal — braille basemap, ADS-B blips, data blocks, trails"
authors = [{name = "Andrew Shuttleworth Fowler"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["adsb", "aircraft", "flight-tracker", "atc", "terminal", "cli", "braille", "true-color"]
classifiers = [
    "Environment :: Console",
    "Topic :: Utilities",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
# pilot voices off macOS: local neural TTS (macOS uses the system `say`)
voice = ["piper-tts>=1.6"]

[project.urls]
Homepage = "https://github.com/ashuttl/blips"
Issues = "https://github.com/ashuttl/blips/issues"

[project.scripts]
blips = "blips.scope:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blips"]
artifacts = ["src/blips/data/*.json.gz"]
